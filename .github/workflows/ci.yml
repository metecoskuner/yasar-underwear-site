name: CI

on:
  push:
    # Run CI on main and feature branches so branch statuses are available on pushes
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Next 16 wants Node >=20.9.0; use Node 20 on CI to avoid engine warnings
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          # Install dependencies at repository root
          npm install --legacy-peer-deps

      - name: Build site
        run: npm run build

      - name: Run lint (non-blocking)
        run: |
          npm run lint || true
