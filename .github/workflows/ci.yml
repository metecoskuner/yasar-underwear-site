name: CI

on:
  push: {}
  pull_request: {}

jobs:
  build:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Install site dependencies
        run: npm --prefix yasar-underwear-site ci --legacy-peer-deps

      - name: Build site
        run: npm --prefix yasar-underwear-site run build

      - name: Run lint (non-blocking)
        run: |
          npm --prefix yasar-underwear-site run lint || true
