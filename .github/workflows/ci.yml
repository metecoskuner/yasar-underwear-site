name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Next 16 wants Node >=20.9.0; use Node 20 on CI to avoid engine warnings
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: |
          # Use npm install here because package-lock.json on main may be out of sync.
          npm install --legacy-peer-deps

      - name: Install site dependencies
        run: |
          npm --prefix yasar-underwear-site install --legacy-peer-deps

      - name: Build site
        run: npm --prefix yasar-underwear-site run build

      - name: Run lint (non-blocking)
        run: |
          npm --prefix yasar-underwear-site run lint || true
